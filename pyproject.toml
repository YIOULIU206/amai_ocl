[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimai-ocl"
version = "0.1.0"
description = "Organizational control layer and multi-agent coordination project built on top of AgenticPay"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
toolguard = [
    "mellea==0.0.3",
    "toolguard @ git+https://github.com/IBM/tool_guard.git@20e21db4c275d79f8d7bf33ffb985d0b45f786f5",
]

[tool.setuptools.packages.find]
include = ["aimai_ocl*"]

[tool.setuptools.package-data]
aimai_ocl = [
    "py.typed",
    "baselines/toolguard_commerce/policies/*.md",
    "baselines/toolguard_commerce/specs/*.yaml",
]

[tool.setuptools.data-files]
"configs" = ["configs/*.yaml", "configs/**/*.yaml"]